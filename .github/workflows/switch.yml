name: Switch build

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of WizzardSK/ppsspp-libretro to build
        default: nx-core

env:
  BUILD_CONFIGURATION: Release

jobs:
  build_switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
    - uses: actions/checkout@v4
      with:
        repository: WizzardSK/ppsspp-libretro
        ref: ${{ github.event.inputs.ref || 'nx-core' }}
        submodules: recursive

    - name: Fix git detected dubious ownership in repository
      run: |
        chown -R $(id -u):$(id -g) $PWD

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: switch

    - name: Build
      run: |
        cd libretro
        make platform=libnx -j$(nproc)

    - name: Package build
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ppsspp-switch-core
        path: libretro/ppsspp_libretro_libnx.a
